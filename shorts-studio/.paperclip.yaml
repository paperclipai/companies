      type: claude_local
      config:
        model: claude-haiku-4-5-20251001
        timeoutSec: 600
        maxTurnsPerRun: 30
  analyst:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-4-5-20251001
        timeoutSec: 600
        maxTurnsPerRun: 20
